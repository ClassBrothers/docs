/* ============================== HELPERS ============================== */

function cx(...a) { return a.filter(Boolean).join(' '); }
function fmtEUR(n) { return n.toLocaleString('de-DE', { maximumFractionDigits: 0 }) + ' €'; }
function fmtNum(n) { return n.toLocaleString('de-DE'); }

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function filterMultiplier(filters) {
  const key = filters.zeitraum + '|' + filters.location + '|' + filters.genre + '|' + filters.reihe;
  const h = hashStr(key);
  return 0.82 + (h % 1000) / 1000 * 0.42; // 0.82 - 1.24
}

/* ============================== SCREEN 1: DASHBOARD ============================== */

function Dashboard({ location, filters, setFilters }) {
  const mult = useMemo(() => filterMultiplier(filters), [filters]);

  const revenueData = useMemo(() => REVENUE_BASE.map(r => ({
    month: r.month,
    aktuell: Math.round(r.aktuell * mult),
    vorjahr: Math.round(r.vorjahr * (mult * 0.94)),
  })), [mult]);

  const genreData = useMemo(() => GENRE_BASE.map(g => ({ ...g, db: Math.round(g.db * mult) })), [mult]);

  const kpis = useMemo(() => {
    const umsatz = Math.round(184320 * mult);
    const gaeste = Math.round(9847 * mult);
    const events = Math.max(6, Math.round(42 * mult));
    const proGast = umsatz / gaeste;
    const delta = Math.round((mult - 1) * 100 + 12);
    return { umsatz, gaeste, events, proGast, delta };
  }, [mult]);

  const GENRE_COLORS = ['#FF2E63', '#00E5C0', '#8B5CF6', '#FFB020', '#4FD1FF'];

  return (
    <div className="p-8 space-y-6">
      <div className="flex flex-wrap items-center gap-3">
        <Select value={filters.zeitraum} onChange={v => setFilters(f => ({ ...f, zeitraum: v }))}
          options={['Jahr 2026', 'Q3 2026', 'Letzte 30 Tage', 'Letztes Jahr']} />
        <Select value={filters.location} onChange={v => setFilters(f => ({ ...f, location: v }))}
          options={['Alle Standorte', ...LOCATIONS]} />
        <Select value={filters.genre} onChange={v => setFilters(f => ({ ...f, genre: v }))}
          options={['Alle Genres', ...GENRES]} />
        <Select value={filters.reihe} onChange={v => setFilters(f => ({ ...f, reihe: v }))}
          options={['Alle Reihen', ...EVENTREIHEN]} />
      </div>

      <div className="grid grid-cols-4 gap-5">
        <KpiTile label="Umsatz YTD" value={fmtEUR(kpis.umsatz)} sub={`${kpis.delta >= 0 ? '+' : ''}${kpis.delta}% vs. Vorjahr`} positive={kpis.delta >= 0} />
        <KpiTile label="Gäste YTD" value={fmtNum(kpis.gaeste)} sub="seit Jahresbeginn" positive={true} />
        <KpiTile label="Ø Umsatz / Gast" value={kpis.proGast.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'} sub="stabil" positive={true} />
        <KpiTile label="Events" value={kpis.events} sub={`in ${filters.zeitraum}`} positive={true} />
      </div>

      <div className="grid grid-cols-3 gap-5">
        <Card title="Umsatz pro Monat" className="col-span-2">
          <ResponsiveContainer width="100%" height={260}>
            <LineChart data={revenueData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#2A2350" />
              <XAxis dataKey="month" stroke="#9B95B8" fontSize={12} />
              <YAxis stroke="#9B95B8" fontSize={12} tickFormatter={v => `${v / 1000}k`} />
              <Tooltip contentStyle={{ background: '#231C42', border: '1px solid #3a2f63', borderRadius: 10, color: '#F5F3FF' }}
                formatter={v => fmtEUR(v)} />
              <Legend wrapperStyle={{ fontSize: 12, color: '#9B95B8' }} />
              <Line type="monotone" dataKey="aktuell" name="2026" stroke="#00E5C0" strokeWidth={3} dot={false} />
              <Line type="monotone" dataKey="vorjahr" name="2025" stroke="#9B95B8" strokeWidth={2} strokeDasharray="4 4" dot={false} />
            </LineChart>
          </ResponsiveContainer>
        </Card>

        <Card title="Nächste Events">
          <div className="flex flex-col gap-3">
            {NEXT_EVENTS.map(ev => {
              const meta = STATUS_META[ev.status];
              return (
                <div key={ev.name} className="flex items-center justify-between gap-2 py-2 border-b border-white/5 last:border-0">
                  <div className="min-w-0">
                    <div className="text-sm font-semibold text-ink truncate">{ev.name}</div>
                    <div className="text-xs text-muted">{ev.date} · {ev.location}</div>
                  </div>
                  <div className="flex items-center gap-1.5 shrink-0">
                    <span className={cx('w-2 h-2 rounded-full', meta.color)} />
                    <span className="text-xs text-muted whitespace-nowrap">{meta.label}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      </div>

      <Card title="Deckungsbeitrag nach Genre">
        <ResponsiveContainer width="100%" height={240}>
          <BarChart data={genreData}>
            <CartesianGrid strokeDasharray="3 3" stroke="#2A2350" />
            <XAxis dataKey="genre" stroke="#9B95B8" fontSize={12} />
            <YAxis stroke="#9B95B8" fontSize={12} tickFormatter={v => `${v / 1000}k`} />
            <Tooltip contentStyle={{ background: '#231C42', border: '1px solid #3a2f63', borderRadius: 10, color: '#F5F3FF' }}
              formatter={v => fmtEUR(v)} />
            <Bar dataKey="db" name="Deckungsbeitrag" radius={[8, 8, 0, 0]}>
              {genreData.map((g, i) => <Cell key={g.genre} fill={GENRE_COLORS[i % GENRE_COLORS.length]} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </Card>
    </div>
  );
}

  const [briefing, setBriefing] = useState('Warm-Up ab 22 Uhr Deep/Melodic, Peak-Time ab 00 Uhr Bass-lastig. Kein Explicit-Intro vor 23 Uhr.');
  const [spotifyLinked, setSpotifyLinked] = useState(true);

  const [personnel, setPersonnel] = useState([
    { role: 'Abendleitung', soll: 1, ist: 1 },
    { role: 'Kasse', soll: 2, ist: 1 },
    { role: 'Türsteher', soll: 3, ist: 3 },
    { role: 'Bar Station 1', soll: 2, ist: 2 },
    { role: 'Bar Station 2', soll: 2, ist: 1 },
    { role: 'Bar Station 3', soll: 2, ist: 2 },
    { role: 'Runner', soll: 2, ist: 2 },
    { role: 'Technik', soll: 1, ist: 1 },
    { role: 'Nachtreinigung', soll: 2, ist: 2 },
  ]);

  const [grafikStatus, setGrafikStatus] = useState('in Arbeit');
  const [eventText, setEventText] = useState('BASSGEFLÜSTER ist zurück – der Sound, der Meier zum Beben bringt. Mit DJ NOVA am Start und den härtesten Bässen der Stadt. Einlass 22 Uhr, ab 18 Jahren.');
  const [textFreigegeben, setTextFreigegeben] = useState(true);
  const [werbebudget, setWerbebudget] = useState(650);
  const [budgetFreigegeben, setBudgetFreigegeben] = useState(true);
  const [fotografGebucht, setFotografGebucht] = useState(true);
  const [vvkPlan] = useState(250);
  const [vvkIst, setVvkIst] = useState(140);

  function adjustIst(idx, delta) {
    setPersonnel(p => p.map((row, i) => i === idx ? { ...row, ist: Math.max(0, row.ist + delta) } : row));
  }
  function pushChiara(role) {
    addToast(`Anfrage an Chiara gesendet für „${role}" ✔`);
  }
  function cycleDj(idx) {
    setDjs(d => d.map((dj, i) => i === idx ? { ...dj, status: nextStage(dj.status) } : dj));
  }

  const djBestaetigt = djs[0].status === 'bestätigt';
  const hotelGebucht = djs[0].hotel;
  const grafikFertig = grafikStatus === 'fertig';
  const personalKomplett = personnel.every(p => p.ist >= p.soll);
  const ticketingOk = vvkIst / vvkPlan >= 0.5;

  const checklist = [
    { label: 'DJ bestätigt', done: djBestaetigt, weight: 12 },
    { label: 'Grafik fertig', done: grafikFertig, weight: 10 },
    { label: 'Personal komplett', done: personalKomplett, weight: 10 },
    { label: 'Hotel gebucht', done: hotelGebucht, weight: 8 },
    { label: 'VVK im Plan', done: ticketingOk, weight: 15 },
    { label: 'Werbebudget freigegeben', done: budgetFreigegeben, weight: 15 },
    { label: 'Fotograf/Videograf gebucht', done: fotografGebucht, weight: 15 },
    { label: 'Eventtext freigegeben', done: textFreigegeben, weight: 15 },
  ];
  const readiness = checklist.reduce((sum, c) => sum + (c.done ? c.weight : 0), 0);
  const openItems = checklist.filter(c => !c.done);

  return (
    <div className="p-8 space-y-6">
      <div className="flex items-start justify-between">
        <div>
          <div className="flex items-center gap-2 mb-1">
            <h2 className="text-2xl font-bold">BASSGEFLÜSTER</h2>
            <Badge color="mint">Meier</Badge>
          </div>
          <p className="text-muted text-sm">Samstag, 12.09.2026 · Hip-Hop / Urban</p>
        </div>
        <button onClick={() => setTemplateOpen(true)}
          className="px-4 py-2.5 rounded-xl text-sm font-semibold bg-card2 border border-white/10 hover:border-magenta/50 transition-colors duration-150">
          + Aus Vorlage anlegen
        </button>
      </div>

      <Card>
        <div className="flex items-center justify-between mb-2">
          <span className="text-sm font-semibold text-ink">Event bereit</span>
          <span className={cx('text-sm font-bold', readiness >= 80 ? 'text-mint' : readiness >= 50 ? 'text-amber' : 'text-magenta')}>{readiness}%</span>
        </div>
        <ProgressBar percent={readiness} colorClass={readiness >= 80 ? 'bg-mint' : readiness >= 50 ? 'bg-amber' : 'bg-magenta'} />
        {openItems.length > 0 && (
          <div className="flex flex-wrap gap-2 mt-3">
            {openItems.map(o => <Badge key={o.label} color="amber">⏳ {o.label}</Badge>)}
          </div>
        )}

      <AccordionSection title="Rahmen">
        <div className="grid grid-cols-4 gap-4 mb-4">
          <div><div className="text-xs text-muted mb-1">Datum</div><div className="text-sm font-semibold">12.09.2026</div></div>

          <div><div className="text-xs text-muted mb-1">Mindestalter</div><div className="text-sm font-semibold">18 Jahre</div></div>

              </div>

                <Toggle checked={dj.hotel} onChange={() => setDjs(d => d.map((x, idx) => idx === i ? { ...x, hotel: !x.hotel } : x))} label="Hotel gebucht" />
                <button onClick={() => cycleDj(i)}>

                </button>
              </div>

            <Toggle checked={spotifyLinked} onChange={() => setSpotifyLinked(s => !s)} label="Spotify-Playlist verknüpft" />

          <div>
            <div className="text-xs text-muted mb-1.5">DJ-Briefing</div>
            <textarea value={briefing} onChange={e => setBriefing(e.target.value)} rows={2}

          </div>
        </div>

      <AccordionSection title="Personal">
        <div className="space-y-2">
          {personnel.map((row, i) => {

            return (
              <div key={row.role} className="flex items-center justify-between py-2 border-b border-white/5 last:border-0">
                <span className="text-sm font-medium w-40">{row.role}</span>
                <div className="flex items-center gap-2">
                  <button onClick={() => adjustIst(i, -1)} className="w-6 h-6 rounded-md bg-card2 hover:bg-white/10 text-sm">−</button>
                  <span className={cx('text-sm font-semibold w-14 text-center', ok ? 'text-mint' : 'text-magenta')}>{row.ist} / {row.soll}</span>
                  <button onClick={() => adjustIst(i, 1)} className="w-6 h-6 rounded-md bg-card2 hover:bg-white/10 text-sm">+</button>
                </div>
                {ok ? <Badge color="mint">besetzt</Badge> : (
                  <button onClick={() => pushChiara(row.role)}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-magenta/10 text-magenta border border-magenta/30 hover:bg-magenta/20 transition-colors duration-150">
                    Push an Chiara
                  </button>
                )}
              </div>
            );
          })}
        </div>
      </AccordionSection>

      <AccordionSection title="Marketing">
        <div className="space-y-5">
          <div className="flex items-center gap-3">
            <span className="text-sm font-medium w-32">Grafik-Status</span>
            <Select value={grafikStatus} onChange={setGrafikStatus} options={['offen', 'in Arbeit', 'fertig']} />
          </div>
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-xs text-muted">Event-Text</span>
              <Toggle checked={textFreigegeben} onChange={() => setTextFreigegeben(v => !v)} label="Freigegeben" />
            </div>
            <textarea value={eventText} onChange={e => setEventText(e.target.value)} rows={3}

          </div>
          <div className="flex items-center gap-6">
            <div className="flex items-center gap-2">
              <span className="text-sm font-medium">Werbebudget</span>
              <input type="number" value={werbebudget} onChange={e => setWerbebudget(Number(e.target.value))}

              <span className="text-sm text-muted">€</span>

            <Toggle checked={budgetFreigegeben} onChange={() => setBudgetFreigegeben(v => !v)} label="Freigegeben" />

          <div>
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-xs text-muted">Ticketing: VVK-Plan vs. VVK-Ist</span>
              <span className="text-xs font-semibold text-ink">{vvkIst} / {vvkPlan}</span>
            </div>
            <ProgressBar percent={(vvkIst / vvkPlan) * 100} colorClass={ticketingOk ? 'bg-mint' : 'bg-amber'} />
            <div className="flex gap-2 mt-2">
              <button onClick={() => setVvkIst(v => Math.max(0, v - 10))} className="px-2.5 py-1 rounded-md bg-card2 text-xs hover:bg-white/10">−10</button>
              <button onClick={() => setVvkIst(v => Math.min(vvkPlan, v + 10))} className="px-2.5 py-1 rounded-md bg-card2 text-xs hover:bg-white/10">+10</button>
            </div>
          </div>
        </div>
      </AccordionSection>

      <AccordionSection title="Ziele">
        <div className="grid grid-cols-2 gap-6">
          <div>
            <div className="text-xs text-muted mb-2">Umsatzplan vs. Vorjahresumsatz</div>
            <div className="flex items-center justify-between text-sm mb-1"><span>Plan</span><span className="font-semibold text-mint">{fmtEUR(9500)}</span></div>
            <ProgressBar percent={100} colorClass="bg-mint" />
            <div className="flex items-center justify-between text-sm mt-3 mb-1"><span>Vorjahr</span><span className="font-semibold text-muted">{fmtEUR(8200)}</span></div>
            <ProgressBar percent={(8200/9500)*100} colorClass="bg-white/20" />
          </div>
          <div>
            <div className="text-xs text-muted mb-2">Gästezahl Plan vs. Vorjahr</div>
            <div className="flex items-center justify-between text-sm mb-1"><span>Plan</span><span className="font-semibold text-mint">480</span></div>
            <ProgressBar percent={100} colorClass="bg-mint" />
            <div className="flex items-center justify-between text-sm mt-3 mb-1"><span>Vorjahr</span><span className="font-semibold text-muted">410</span></div>
            <ProgressBar percent={(410/480)*100} colorClass="bg-white/20" />
          </div>
        </div>
      </AccordionSection>

      <Modal open={templateOpen} onClose={() => setTemplateOpen(false)} title="Eventreihen-Vorlage wählen">
        <div className="space-y-3">
          {TEMPLATES.map(t => (
            <button key={t.id} onClick={() => { setTemplateOpen(false); addToast(`Vorlage „${t.name}" übernommen ✔`); }}
              className="w-full text-left bg-card rounded-xl p-4 border border-white/5 hover:border-magenta/40 transition-colors duration-150">
              <div className="font-semibold text-sm">{t.name}</div>
              <div className="text-xs text-muted mt-1">{t.desc}</div>
            </button>
          ))}
        </div>
      </Modal>
    </div>
  );
}

function GradientTile({ label, ratio, title, gradient }) {
  return (
    <div className="flex flex-col gap-2">
      <div className={cx('rounded-xl overflow-hidden flex items-end p-4 relative', ratio)} style={{ background: gradient }}>
        <div className="absolute inset-0 bg-black/20" />
        <div className="relative z-10">
          <div className="text-xs font-semibold text-white/70 mb-1">{label}</div>
          <div className="text-white font-black text-xl leading-tight drop-shadow">{title}</div>
        </div>
      </div>
    </div>
  );
}

function CopyBlock({ label, text, addToast }) {
  function copy() {
    if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); }
    addToast('Text kopiert ✔');
  }
  return (
    <div className="bg-card2 rounded-xl p-4 border border-white/5">
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs font-semibold text-muted uppercase tracking-wide">{label}</span>
        <button onClick={copy} className="text-xs font-semibold text-mint hover:text-mint/70 transition-colors duration-150">⧉ Kopieren</button>
      </div>
      <p className="text-sm text-ink/90 leading-relaxed">{text}</p>
    </div>
  );
}

/* ============================== SCREEN 4: DISTRIBUTION ============================== */

function Distribution({ addToast }) {
  const [active, setActive] = useState(() => Object.fromEntries(CHANNELS.map(c => [c.id, c.connected])));
  const [schedule, setSchedule] = useState(() => Object.fromEntries(CHANNELS.map(c => [c.id, 'sofort'])));
  const [publishing, setPublishing] = useState(false);
  const [progress, setProgress] = useState(0);
  const [published, setPublished] = useState({});
  const [history, setHistory] = useState(HISTORY_INITIAL);

  function toggleActive(id) {
    setActive(a => ({ ...a, [id]: !a[id] }));
  }

  function publish() {
    setPublishing(true);
    setProgress(0);
    setPublished({});
    let p = 0;
    const timer = setInterval(() => {
      p += 14;
      setProgress(Math.min(100, p));
      if (p >= 100) {
        clearInterval(timer);
        const now = new Date();
        const ts = now.toLocaleDateString('de-DE') + ', ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        const done = {};
        let count = 0;
        CHANNELS.forEach(c => { if (active[c.id]) { done[c.id] = ts; count++; } });
        setPublished(done);
        setPublishing(false);
        setHistory(h => [{ id: 'h' + Date.now(), text: `BASSGEFLÜSTER – ausgespielt an ${count} Kanäle`, time: ts }, ...h]);
        addToast(`Erfolgreich an ${count} Kanäle ausgespielt ✔`);
      }
    }, 220);
  }

  return (
    <div className="p-8 space-y-6">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-2xl font-bold">Distribution</h2>
          <p className="text-muted text-sm">BASSGEFLÜSTER · 12.09.2026</p>
        </div>
        <button onClick={publish} disabled={publishing}
          className="px-6 py-3 rounded-xl font-bold bg-gradient-to-r from-magenta to-mint text-bg hover:opacity-90 transition-opacity duration-150 flex items-center gap-2">
          {publishing ? <><span className="spin">⏳</span> Wird ausgespielt… {progress}%</> : '🚀 Jetzt ausspielen'}
        </button>
      </div>

      {publishing && (
        <Card><ProgressBar percent={progress} colorClass="bg-gradient-to-r from-magenta to-mint" /></Card>
      )}

      <Card title="Kanäle">
        <div className="grid grid-cols-2 gap-4">
          {CHANNELS.map(c => (
            <div key={c.id} className={cx('flex items-center gap-4 p-4 rounded-xl border transition-colors duration-150',
              active[c.id] ? 'bg-card2 border-white/10' : 'bg-card2/40 border-white/5 opacity-60')}>
              <div className="w-12 h-12 rounded-lg flex items-center justify-center text-xl shrink-0"
                style={{ background: 'linear-gradient(135deg, #FF2E63, #00E5C0)' }}>{c.emoji}</div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <span className="text-sm font-semibold truncate">{c.name}</span>
                  {!c.connected && <Badge color="magenta">getrennt</Badge>}
                </div>
                <div className="mt-1.5">
                  <select value={schedule[c.id]} onChange={e => setSchedule(s => ({ ...s, [c.id]: e.target.value }))}
                    disabled={!active[c.id]}
                    className="bg-bg border border-white/10 rounded-md px-2 py-1 text-xs focus:outline-none">
                    <option value="sofort">sofort</option>
                    <option value="geplant">geplant · 20:00 Uhr</option>
                  </select>
                </div>
              </div>
              <div className="flex flex-col items-end gap-2 shrink-0">
                <Toggle checked={active[c.id]} onChange={() => toggleActive(c.id)} />
                {published[c.id] && <span className="text-[11px] text-mint font-semibold">✔ {published[c.id]}</span>}
              </div>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Zuletzt ausgespielt">
        <div className="space-y-2">
          {history.map(h => (
            <div key={h.id} className="flex items-center justify-between py-2 border-b border-white/5 last:border-0 text-sm">
              <span className="text-ink">{h.text}</span>
              <span className="text-muted text-xs">{h.time}</span>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============================== SCREEN 5: NACHKALKULATION ============================== */

function Nachkalkulation() {
  const erloeseSum = POSTCALC.erloese.reduce((s, e) => s + e.value, 0);
  const kostenSum = POSTCALC.kosten.reduce((s, k) => s + k.value, 0);
  const db = erloeseSum - kostenSum;
  const dbProz = (db / erloeseSum) * 100;

  return (
    <div className="p-8 space-y-6">
      <div>
        <h2 className="text-2xl font-bold">{POSTCALC.event}</h2>
        <p className="text-muted text-sm">{POSTCALC.date} · Nachkalkulation</p>
      </div>

      <div className="grid grid-cols-[1fr_320px] gap-6">
        <div className="space-y-6">
          <Card title="Erlöse">
            <div className="space-y-2">
              {POSTCALC.erloese.map(e => (
                <div key={e.label} className="flex items-center justify-between py-1.5 text-sm">
                  <span>{e.label}</span>
                  <span className="font-semibold text-mint">{fmtEUR(e.value)}</span>
                </div>
              ))}
              <div className="flex items-center justify-between pt-2 mt-2 border-t border-white/10 text-sm font-bold">
                <span>Summe Erlöse</span>
                <span className="text-mint">{fmtEUR(erloeseSum)}</span>
              </div>
            </div>
          </Card>

          <Card title="Kosten">
            <div className="space-y-2">
              {POSTCALC.kosten.map(k => {
                const prozent = (k.value / erloeseSum) * 100;
                const over = prozent > k.ziel;
                return (
                  <div key={k.label} className="flex items-center justify-between py-1.5 text-sm">
                    <span>{k.label}</span>
                    <div className="flex items-center gap-3">
                      <span className={cx('text-xs font-semibold', over ? 'text-magenta' : 'text-muted')}>
                        {prozent.toFixed(1)}% {over && '⚠'}
                      </span>
                      <span className="font-semibold w-20 text-right">{fmtEUR(k.value)}</span>
                    </div>
                  </div>
                );
              })}
              <div className="flex items-center justify-between pt-2 mt-2 border-t border-white/10 text-sm font-bold">
                <span>Summe Kosten</span>
                <span className="text-magenta">{fmtEUR(kostenSum)}</span>
              </div>
            </div>
          </Card>

          <div className="bg-gradient-to-r from-magenta/15 to-mint/15 rounded-2xl p-6 border border-white/10 flex items-center justify-between">
            <span className="text-lg font-bold">Deckungsbeitrag</span>
            <span className="text-3xl font-black text-mint">{fmtEUR(db)} <span className="text-lg text-mint/70">/ {dbProz.toFixed(1)}%</span></span>
          </div>

          <Card title="Learnings">
            <ul className="space-y-3">
              {POSTCALC.learnings.map((l, i) => (
                <li key={i} className="flex gap-2 text-sm text-ink/90">
                  <span className="text-mint shrink-0">💡</span>
                  <span>{l}</span>
                </li>
              ))}
            </ul>
          </Card>
        </div>

        <div className="space-y-6 h-fit sticky top-8">
          <Card title="Vergleich Umsatz">
            <CompareRow label="Plan" value={POSTCALC.vergleich.umsatz.plan} />
            <CompareRow label="Vorjahr" value={POSTCALC.vergleich.umsatz.vorjahr} />
            <CompareRow label="Ist" value={POSTCALC.vergleich.umsatz.ist} highlight />
          </Card>
          <Card title="Vergleich Deckungsbeitrag">
            <CompareRow label="Plan" value={POSTCALC.vergleich.db.plan} sub={`${POSTCALC.vergleich.db.dbProzentPlan}%`} />
            <CompareRow label="Vorjahr" value={POSTCALC.vergleich.db.vorjahr} sub={`${POSTCALC.vergleich.db.dbProzentVorjahr}%`} />
            <CompareRow label="Ist" value={POSTCALC.vergleich.db.ist} sub={`${POSTCALC.vergleich.db.dbProzentIst}%`} highlight />
          </Card>
        </div>
      </div>
    </div>
  );
}

function CompareRow({ label, value, sub, highlight }) {
  return (
    <div className={cx('flex items-center justify-between py-2.5', !highlight && 'border-b border-white/5 last:border-0')}>
      <span className={cx('text-sm', highlight ? 'font-bold text-ink' : 'text-muted')}>{label}</span>
      <div className="text-right">
        <div className={cx('text-sm font-bold', highlight ? 'text-mint' : 'text-ink')}>{fmtEUR(value)}</div>
        {sub && <div className="text-xs text-muted">{sub}</div>}
      </div>
    </div>
  );
}

/* ============================== SCREEN 6: TEAM-SCREEN (KIOSK) ============================== */

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const gaesteHeute = 312, gaesteVorjahr = 278, ziel = 360;
  const vvkVerkauft = 140, vvkGesamt = 250;
  const bars = [
    { name: 'Bar 1 · Eingang', umsatz: 3240 },
    { name: 'Bar 2 · Terrasse', umsatz: 2860 },
    { name: 'Bar 3 · Lounge', umsatz: 2010 },
  ];
  const zielProzent = (gaesteHeute / ziel) * 100;

  return (
    <div className="min-h-screen bg-bg flex flex-col p-10 relative">
      <button onClick={onBack} className="absolute top-8 right-10 px-4 py-2 rounded-xl text-sm font-semibold bg-card2 border border-white/10 hover:border-magenta/50 transition-colors duration-150">
        ← Zurück
      </button>
      <div className="text-center mb-10">
        <div className="text-muted text-sm uppercase tracking-widest">BASSGEFLÜSTER · Meier</div>
        <div className="text-6xl font-mono font-bold text-ink mt-2">{now.toLocaleTimeString('de-DE')}</div>
      </div>

      <div className="grid grid-cols-3 gap-8 mb-10">
        <div className="bg-card rounded-3xl p-8 text-center border border-white/5">
          <div className="text-muted text-sm uppercase tracking-wide mb-2">Gäste heute</div>
          <div className="text-7xl font-black text-mint">{gaesteHeute}</div>
          <div className="text-sm text-muted mt-2">Vorjahr: {gaesteVorjahr}</div>
        </div>
        <div className="bg-card rounded-3xl p-8 text-center border border-white/5">
          <div className="text-muted text-sm uppercase tracking-wide mb-2">VVK verkauft</div>
          <div className="text-7xl font-black text-ink">{vvkVerkauft}<span className="text-3xl text-muted">/{vvkGesamt}</span></div>
          <div className="text-sm text-muted mt-2">{Math.round((vvkVerkauft/vvkGesamt)*100)}% verkauft</div>
        </div>
        <div className="bg-card rounded-3xl p-8 text-center border border-white/5 flex flex-col justify-center">
          <div className="text-muted text-sm uppercase tracking-wide mb-3">Zielerreichung</div>
          <div className="text-5xl font-black text-magenta mb-3">{zielProzent.toFixed(0)}%</div>
          <ProgressBar percent={zielProzent} colorClass="bg-magenta" />
        </div>
      </div>

      <div className="bg-card rounded-3xl p-8 border border-white/5 mb-10">
        <div className="text-muted text-sm uppercase tracking-wide mb-4">Barstationen · Ranking nach Umsatz</div>
        <div className="space-y-4">
          {bars.sort((a,b)=>b.umsatz-a.umsatz).map((b, i) => (
            <div key={b.name} className="flex items-center gap-4">
              <span className="text-2xl font-black text-muted w-8">{i+1}.</span>
              <span className="text-lg font-semibold flex-1">{b.name}</span>
              <span className="text-2xl font-bold text-mint">{fmtEUR(b.umsatz)}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="text-center mt-auto">
        <p className="text-2xl font-bold bg-gradient-to-r from-magenta to-mint bg-clip-text text-transparent">
          Weiter so — noch {vvkGesamt - vvkVerkauft} Tickets bis ausverkauft! 🔥
        </p>
      </div>
    </div>
  );
}

/* ============================== SCREEN 7: EINSTELLUNGEN ============================== */

function Einstellungen({ addToast }) {
  const [channels, setChannels] = useState(CHANNELS);
  function toggleConn(id) {
    setChannels(cs => cs.map(c => c.id === id ? { ...c, connected: !c.connected } : c));
    const c = channels.find(c => c.id === id);
    addToast(c.connected ? `${c.name} getrennt` : `${c.name} verbunden ✔`);
  }

  return (
    <div className="p-8 space-y-6">
      <h2 className="text-2xl font-bold mb-2">Einstellungen</h2>

      <Card title="Verbundene Kanäle">
        <div className="grid grid-cols-2 gap-3">
          {channels.map(c => (
            <div key={c.id} className="flex items-center justify-between bg-card2 rounded-xl p-3.5">
              <div className="flex items-center gap-3">
                <span className="text-lg">{c.emoji}</span>
                <span className="text-sm font-medium">{c.name}</span>
              </div>
              <button onClick={() => toggleConn(c.id)}>
                <Badge color={c.connected ? 'mint' : 'magenta'}>{c.connected ? 'Verbunden' : 'Getrennt'}</Badge>
              </button>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Locations">
        <div className="grid grid-cols-3 gap-4">
          {LOCATION_DETAILS.map(l => (
            <div key={l.name} className="bg-card2 rounded-xl p-4">
              <div className="font-bold text-sm mb-1">{l.name}</div>
              <div className="text-xs text-muted mb-1">{l.address}</div>
              <div className="text-xs text-mint font-semibold">Kapazität: {l.capacity}</div>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Eventreihen-Vorlagen">
        <div className="space-y-2">
          {TEMPLATES.map(t => (
            <div key={t.id} className="flex items-center justify-between bg-card2 rounded-xl p-4">
              <div>
                <div className="font-semibold text-sm">{t.name}</div>
                <div className="text-xs text-muted mt-0.5">{t.desc}</div>
              </div>
              <button onClick={() => addToast(`„${t.name}" wird bearbeitet (Demo)`)}
                className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-card border border-white/10 hover:border-magenta/50 transition-colors duration-150">
                Bearbeiten
              </button>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Team-Mitglieder">
        <div className="grid grid-cols-4 gap-4">
          {TEAM.map(m => (
            <div key={m.name} className="bg-card2 rounded-xl p-4 flex flex-col items-center text-center gap-2">
              <div className={cx('w-12 h-12 rounded-full bg-gradient-to-br flex items-center justify-center font-bold text-bg', m.color)}>{m.initials}</div>
              <div>
                <div className="font-semibold text-sm">{m.name}</div>
                <div className="text-xs text-muted">{m.role}</div>
              </div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============================== DEMO TOUR ============================== */

const TOUR_STEPS = [
  { screen: 'dashboard', text: 'Auf einen Blick: Umsatz, Gäste und welche Events noch Aufmerksamkeit brauchen — kein Excel mehr nötig.' },
  { screen: 'planner', text: 'Jedes Event hat einen Fortschrittsbalken. Sofort sichtbar: was fehlt noch bis zur Türöffnung?' },
  { screen: 'ai', text: 'Grafiken und Texte in Sekunden statt tagelanger Agentur-Abstimmung.' },
  { screen: 'distribution', text: 'Ein Klick, alle Kanäle bespielt — Website, App, Social, Signage, Presse.' },
  { screen: 'postcalc', text: 'Nach dem Event sofort sehen, was der Abend wirklich gebracht hat — nicht erst nächsten Monat vom Steuerberater.' },
];

function DemoTour({ step, onNext, onPrev, onEnd }) {
  const s = TOUR_STEPS[step];
  return (
    <div className="fixed inset-0 z-[80] pointer-events-none">
      <div className="absolute inset-0 bg-black/40 pointer-events-auto" onClick={onEnd} />
      <div className="absolute bottom-10 left-1/2 -translate-x-1/2 w-[560px] max-w-[92vw] bg-card2 border border-magenta/40 rounded-2xl p-6 shadow-2xl pointer-events-auto fade-in">
        <div className="flex items-center justify-between mb-3">
          <span className="text-xs font-bold text-magenta uppercase tracking-wide">Demo-Tour · Schritt {step + 1}/{TOUR_STEPS.length}</span>
          <button onClick={onEnd} className="text-muted hover:text-ink text-sm">Beenden ×</button>
        </div>
        <p className="text-base text-ink leading-relaxed mb-5">{s.text}</p>
        <div className="flex items-center justify-between">
          <div className="flex gap-1.5">
            {TOUR_STEPS.map((_, i) => (
              <span key={i} className={cx('w-2 h-2 rounded-full', i === step ? 'bg-magenta' : 'bg-white/15')} />
            ))}
          </div>
          <div className="flex gap-2">
            {step > 0 && <button onClick={onPrev} className="px-4 py-2 rounded-lg text-sm font-semibold bg-card border border-white/10 hover:border-white/30 transition-colors duration-150">Zurück</button>}
            <button onClick={onNext} className="px-4 py-2 rounded-lg text-sm font-semibold bg-gradient-to-r from-magenta to-mint text-bg hover:opacity-90 transition-opacity duration-150">
              {step === TOUR_STEPS.length - 1 ? 'Fertig' : 'Weiter'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== APP ============================== */

const SCREEN_TITLES = {
  dashboard: ['Dashboard', 'Alle Standorte im Überblick'],
  planner: ['Eventplaner', 'Detailplanung pro Event'],
  ai: ['KI-Assets', 'Grafiken & Texte automatisch erstellen'],
  distribution: ['Distribution', 'Kanäle zentral bespielen'],
  postcalc: ['Nachkalkulation', 'Was hat der Abend wirklich gebracht?'],
  settings: ['Einstellungen', 'Kanäle, Locations, Team'],
};

function App() {
  const [screen, setScreen] = useState('dashboard');
  const [location, setLocation] = useState('Meier');
  const [filters, setFilters] = useState({ zeitraum: 'Jahr 2026', location: 'Alle Standorte', genre: 'Alle Genres', reihe: 'Alle Reihen' });
  const [toasts, setToasts] = useState([]);
  const [tour, setTour] = useState({ active: false, step: 0 });

  function addToast(msg, type = 'info') {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  }

  function startTour() {
    setTour({ active: true, step: 0 });
    setScreen(TOUR_STEPS[0].screen);
  }
  function tourNext() {
    if (tour.step === TOUR_STEPS.length - 1) { setTour({ active: false, step: 0 }); return; }
    const next = tour.step + 1;
    setTour({ active: true, step: next });
    setScreen(TOUR_STEPS[next].screen);
  }
  function tourPrev() {
    const prev = Math.max(0, tour.step - 1);
    setTour({ active: true, step: prev });
    setScreen(TOUR_STEPS[prev].screen);
  }
  function tourEnd() { setTour({ active: false, step: 0 }); }

  if (screen === 'kiosk') {
    return (
      <>
        <TeamScreen onBack={() => setScreen('dashboard')} />
        <ToastStack toasts={toasts} />
      </>
    );
  }

  const [title, subtitle] = SCREEN_TITLES[screen] || ['', ''];

  return (
    <div className="flex min-h-screen">
      <Sidebar screen={screen} setScreen={setScreen} tourActive={tour.active} />
      <div className="flex-1 min-w-0">
        <Header location={location} setLocation={setLocation} onStartTour={startTour} title={title} subtitle={subtitle} />
        {screen === 'dashboard' && <Dashboard location={location} filters={filters} setFilters={setFilters} />}
        {screen === 'planner' && <Eventplaner addToast={addToast} />}
        {screen === 'ai' && <KiAssets addToast={addToast} />}
        {screen === 'distribution' && <Distribution addToast={addToast} />}
        {screen === 'postcalc' && <Nachkalkulation />}
        {screen === 'settings' && <Einstellungen addToast={addToast} />}
      </div>
      {tour.active && <DemoTour step={tour.step} onNext={tourNext} onPrev={tourPrev} onEnd={tourEnd} />}
      <ToastStack toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
